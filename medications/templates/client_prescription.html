{% extends 'base.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resep Obat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
            font-size: 36px;
            font-weight: 800;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #3498db;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #e9f7fe;
        }
        td:nth-child(2) {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>RESEP OBAT</h1>
    <table>
        <thead>
            <tr>
                <th>Jenis Perawatan</th>
                <th>Obat</th>
                <th>Kuantitas Obat</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>TRM001 - Perawatan Gigi</td>
                <td>MED001 - Amoxicillin</td>
                <td>2</td>
            </tr>
            <tr>
                <td>TRM002 - Grooming</td>
                <td>MED002 - Dexamethasone</td>
                <td>4</td>
            </tr>
            <tr>
                <td>TRM003 - Pembersihan Telinga</td>
                <td>MED007 - Antibiotik Telinga</td>
                <td>2</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
{% endblock %}
