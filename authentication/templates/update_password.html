{% extends 'base.html' %}
{% load static %}

{% block meta %}
    <title>Update Password - Pet Clinic</title>
    <link rel="stylesheet" href="{% static 'css/css_auth.css' %}">
{% endblock meta %}

{% block content %}
<div class="max-w-6xl mx-auto mt-10 px-4">
    
    <div class="register-form">
        <h1 class="form-title">Update Password</h1>
        {% if messages %}
        <div class="messages">
            {% for message in messages %} 
                <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
        
        <form method="post" action="{% url 'authentication:update_password' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="current_password" class="required">Current Password</label>
                <input type="password" id="current_password" name="current_password" placeholder="Enter your current password" required>
            </div>
            
            <div class="form-group">
                <label for="new_password" class="required">New Password</label>
                <input type="password" id="new_password" name="new_password" placeholder="Enter your new password" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_password" class="required">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your new password" required>
            </div>
            
            <button type="submit" class="submit-btn">Update Password</button>
            
            <div class="back-link">
                <a href="{% url 'authentication:dashboard' %}">Back to Dashboard</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
