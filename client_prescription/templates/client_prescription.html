{% extends 'base.html' %}

{% block content %}

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resep Obat Saya - Pet Clinic</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c5aa0;
            --secondary-color: #f8f9fa;
            --accent-color: #17a2b8;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --green-primary: #28a745;
            --green-secondary: #20c997;
        }

        body {
            background: #ffffff;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-container {
            background: rgba(255, 255, 255, 1);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 2px solid #e9ecef;
            margin: 20px;
            min-height: calc(100vh - 40px);
        }

        .header-section {
            background: linear-gradient(135deg, var(--green-primary), var(--green-secondary));
            color: white;
            padding: 30px;
            border-radius: 18px 18px 0 0;
            text-align: center;
            border: 3px solid rgba(40, 167, 69, 0.3);
            border-bottom: none;
        }

        .header-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            -webkit-text-stroke: 1px rgba(255,255,255,0.2);
        }

        .header-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content-section {
            padding: 30px;
            border-left: 2px solid #e9ecef;
            border-right: 2px solid #e9ecef;
            border-bottom: 2px solid #e9ecef;
            border-radius: 0 0 18px 18px;
        }

        .visit-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border: 2px solid #dee2e6;
            margin-bottom: 25px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .visit-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            border-color: var(--green-primary);
        }

         .visit-header {
            background: linear-gradient(135deg, var(--green-primary), var(--success-color));
            color: white;
            padding: 20px;
            position: relative;
            border: 3px solid rgba(40, 167, 69, 0.3);
            border-bottom: none;
        }

        .visit-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .doctor-info {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 5px;
        }

        .treatment-section {
            padding: 20px;
            border-left: 2px solid #dee2e6;
            border-right: 2px solid #dee2e6;
            border-bottom: 2px solid #dee2e6;
        }

        .treatment-header {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid rgba(108, 92, 231, 0.3);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .treatment-name {
            font-size: 1.2rem;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .treatment-cost {
            background: rgba(255,255,255,0.2);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.3);
            font-weight: 600;
        }

        .medicines-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .medicine-card {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border: 2px solid #dee2e6;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .medicine-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1);
        }

        .medicine-card:hover {
            border-color: var(--green-primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .medicine-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--green-primary);
            margin-bottom: 10px;
            text-shadow: 0.5px 0.5px 1px rgba(0,0,0,0.1);
        }

        .medicine-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.9rem;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .detail-label {
            color: #6c757d;
            font-weight: 500;
        }

        .detail-value {
            font-weight: 600;
            color: #343a40;
        }

        .price-highlight {
            color: var(--success-color);
            font-weight: 700;
            text-shadow: 0.5px 0.5px 1px rgba(0,0,0,0.1);
        }

        .total-section {
            background: linear-gradient(135deg, var(--green-primary), var(--green-secondary));
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid rgba(40, 167, 69, 0.3);
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 15px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .no-prescriptions {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
            border: 2px dashed #dee2e6;
            border-radius: 15px;
            background: #f8f9fa;
        }

        .empty-icon {
            font-size: 4rem;
            color: #dee2e6;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            background: #f8f9fa;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .main-container {
                margin: 10px;
                border-radius: 15px;
            }

            .header-title {
                font-size: 2rem;
            }

            .content-section {
                padding: 20px;
            }

            .medicines-grid {
                grid-template-columns: 1fr;
            }

            .medicine-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header-section">
            <h1 class="header-title">
                <i class="fas fa-prescription-bottle-alt"></i>
                Resep Obat Saya
            </h1>
        </div>

        <div class="content-section">
            <div id="loading" class="loading-spinner">
                <div class="spinner-border text-success" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3">Memuat data resep obat...</p>
            </div>

            <div id="error-container" style="display: none;"></div>

            <div id="prescriptions-container">
            </div>

            <div id="no-prescriptions" class="no-prescriptions" style="display: none;">
                <div class="empty-icon">
                    <i class="fas fa-prescription-bottle-alt"></i>
                </div>
                <h3>Belum Ada Resep Obat</h3>
                <p>Anda belum memiliki resep obat dari kunjungan perawatan.<br>
                Resep akan muncul setelah dokter memberikan perawatan dan obat.</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
    <script>
        let prescriptionsData = [];
        
        try {
            prescriptionsData = {{ prescriptions|safe }};
            console.log('Loaded prescriptions data:', prescriptionsData);
        } catch (error) {
            console.error('Error parsing prescriptions data:', error);
            showError('Gagal memuat data resep obat');
        }

        document.addEventListener('DOMContentLoaded', function() {
            hideLoading();
            loadPrescriptions(prescriptionsData);
        });

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = `
                <div class="error-message">
                    <i class="fas fa-exclamation-triangle"></i>
                    <strong>Error:</strong> ${message}
                </div>
            `;
            errorContainer.style.display = 'block';
        }

        function loadPrescriptions(prescriptions) {
            const container = document.getElementById('prescriptions-container');
            const noPrescriptions = document.getElementById('no-prescriptions');

            if (!prescriptions || prescriptions.length === 0) {
                noPrescriptions.style.display = 'block';
                return;
            }

            const totalVisits = prescriptions.length;
            const totalTreatments = prescriptions.reduce((sum, visit) => sum + visit.treatments.length, 0);
            const totalMedicines = prescriptions.reduce((sum, visit) => 
                sum + visit.treatments.reduce((tSum, treatment) => tSum + treatment.medicines.length, 0), 0);
            const grandTotal = prescriptions.reduce((sum, visit) => sum + visit.visit_total, 0);

            const statsHTML = `
                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-number">${totalVisits}</div>
                        <div class="stat-label">Total Kunjungan</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${totalTreatments}</div>
                        <div class="stat-label">Total Perawatan</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${totalMedicines}</div>
                        <div class="stat-label">Total Obat</div>
                    </div>
                </div>
            `;

            let html = statsHTML;

            prescriptions.forEach(visit => {
                const visitDate = new Date(visit.visit_info.timestamp_awal).toLocaleDateString('id-ID', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                html += `
                    <div class="visit-card">
                        <div class="visit-header">
                            <div class="visit-title">
                                <i class="fas fa-paw"></i>
                                Kunjungan ${visit.visit_info.nama_hewan}
                            </div>
                        </div>

                        <div class="treatment-section">
                `;

                visit.treatments.forEach(treatment => {
                    html += `
                        <div class="treatment-header">
                            <div>
                                <div class="treatment-name">${treatment.treatment_info.nama_perawatan}</div>
                                <small>Kode: ${treatment.treatment_info.kode_perawatan}</small>
                            </div>
                        </div>

                        <div class="medicines-grid">
                    `;

                    if (treatment.medicines && treatment.medicines.length > 0) {
                        treatment.medicines.forEach(medicine => {
                            html += `
                                <div class="medicine-card">
                                    <div class="medicine-name">
                                        <i class="fas fa-pills"></i>
                                        ${medicine.nama_obat}
                                    </div>
                                    <div class="medicine-details">
                                        <div class="detail-item">
                                            <span class="detail-label">Kode Obat:</span>
                                            <span class="detail-value">${medicine.kode_obat}</span>
                                        </div>
                                        <div class="detail-item">
                                            <span class="detail-label">Dosis:</span>
                                            <span class="detail-value">${medicine.dosis || 'Sesuai petunjuk dokter'}</span>
                                        </div>
                                        <div class="detail-item">
                                            <span class="detail-label">Jumlah:</span>
                                            <span class="detail-value">${medicine.kuantitas_obat}</span>
                                        </div>
                                        <div class="detail-item">
                                            <span class="detail-label">Harga Satuan:</span>
                                            <span class="detail-value price-highlight">Rp ${formatCurrency(medicine.harga_obat)}</span>
                                        </div>
                                        <div class="detail-item">
                                            <span class="detail-label">Total:</span>
                                            <span class="detail-value price-highlight">Rp ${formatCurrency(medicine.total_obat)}</span>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                    } else {
                        html += `
                            <div class="medicine-card">
                                <div class="medicine-name">
                                    <i class="fas fa-info-circle"></i>
                                    Tidak ada obat untuk perawatan ini
                                </div>
                            </div>
                        `;
                    }

                    html += `</div>`;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function formatCurrency(amount) {
            if (amount === null || amount === undefined) return '0';
            return new Intl.NumberFormat('id-ID').format(amount);
        }

        function refreshPrescriptions() {
            window.location.reload();
        }

        function handleAjaxError(xhr, status, error) {
            console.error('AJAX Error:', status, error);
            showError('Gagal memuat data dari server. Silakan refresh halaman.');
        }
    </script>
</body>
</html>

{% endblock content %}
