{# konten dimasukkan via fetch #}
<h2 class="text-2xl font-bold text-red-600 mb-6">Delete Animal Type</h2>
<p class="mb-8">
  Apakah kamu yakin untuk menghapus Jenis Hewan
  <span class="font-semibold text-red-600">{{ jenis_hewan.nama_jenis }}</span>
  dengan kode <span class="font-semibold text-red-600">{{ jenis_hewan.id }}</span>?
</p>

<form method="post" action="{% url 'animals:jenis_hewan_delete' jenis_hewan.id %}">
  {% csrf_token %}
  <div class="flex justify-end space-x-3">
    <button type="button" onclick="closeTypeDeleteModal()"
            class="px-5 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-100">
      Cancel
    </button>
    <button type="submit"
            class="px-6 py-2 rounded text-white bg-red-500 hover:bg-red-600">
      Confirm Deletion
    </button>
  </div>
</form>
