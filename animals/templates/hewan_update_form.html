<form method="post"
      id="updatePetForm"
      action="{% url 'animals:hewan_update' hewan.nama hewan.no_identitas_klien %}?modal=true"
      class="max-w-md mx-auto rounded-lg p-8">

  {% csrf_token %}

  <h2 class="text-2xl font-bold mb-8">Update Pet</h2>

  {# ========= PEMILIK ========= #}
  <div class="mb-6">
    <label class="block text-gray-700 mb-2">Pemilik</label>

    {% if is_client %}
      <input type="text" value="{{ nama_pemilik }}" readonly
             class="w-full px-4 py-2 border rounded-lg bg-gray-100">
    {% else %}
      <select name="no_identitas_klien" required
              class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-200">
        {% for klien in klien_list %}
          <option value="{{ klien.no_identitas }}"
                  {% if klien.no_identitas == hewan.no_identitas_klien %}selected{% endif %}>
            {{ klien.nama_pemilik }}
          </option>
        {% endfor %}
      </select>
    {% endif %}
  </div>

  {# ========= JENIS HEWAN ========= #}
  <div class="mb-6">
    <label class="block text-gray-700 mb-2">Jenis Hewan</label>
    <select name="id_jenis" required
            class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-200">
      {% for jenis in jenis_hewan_list %}
        <option value="{{ jenis.id }}" {% if jenis.id == hewan.id_jenis %}selected{% endif %}>
          {{ jenis.nama_jenis }}
        </option>
      {% endfor %}
    </select>
  </div>

  {# ========= NAMA HEWAN ========= #}
  <div class="mb-6">
    <label class="block text-gray-700 mb-2">Nama Hewan</label>
    <input type="text" name="nama" value="{{ hewan.nama }}" required
           class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-200">
  </div>

  {# ========= TANGGAL LAHIR ========= #}
  <div class="mb-6">
    <label class="block text-gray-700 mb-2">Tanggal Lahir Hewan</label>
    <input type="date" name="tanggal_lahir"
           value="{{ hewan.tanggal_lahir|date:'Y-m-d' }}" required
           class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-200">
  </div>

  {# ========= URL FOTO ========= #}
  <div class="mb-8">
    <label class="block text-gray-700 mb-2">URL Foto Hewan</label>
    <input type="url" name="url_foto" value="{{ hewan.url_foto }}" required
           class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-200">
  </div>

  {# ========= BUTTONS ========= #}
  <div class="flex justify-end space-x-3">
    <button type="button"
            onclick="closeModal()"
            class="px-5 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-100">
      Cancel
    </button>

    <button type="submit"
            class="px-6 py-2 rounded text-white bg-[#0F1327] hover:bg-[#1c2244]">
      Update
    </button>
  </div>
</form>

<script>
document.getElementById('updatePetForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const fd = new FormData(this);
  fetch(window.location.href, {
    method: 'POST',
    body: fd,
    headers: { 'X-CSRFToken': fd.get('csrfmiddlewaretoken') }
  })
  .then(r => r.json())
  .then(d => {
    if (d.message) {
      closeModal();
      window.location.reload();
    } else if (d.error) {
      alert('Error: ' + d.error);
    }
  })
  .catch(() => alert('Terjadi kesalahan saat memperbarui data'));
});
</script>
