<!-- update.html -->
{% extends 'base.html' %}
{% load static %}

{% block title %}Update Kunjungan - Pet Clinic{% endblock %}

{% block content %}
<div class="container mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6 text-gray-800">Update Kunjungan</h1>

    <form method="post" action="{% url 'visits:update_visit' visit.id_kunjungan %}" class="bg-white p-6 rounded-lg shadow-md">
        {% csrf_token %}
        <input type="hidden" name="id_kunjungan" value="{{ visit.id_kunjungan }}">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="flex flex-col">
                <label for="id-klien" class="mb-2 text-gray-700 font-semibold">ID Klien</label>
                <select id="id-klien" name="id_klien" class="border rounded-lg p-3 focus:ring-2 focus:ring-blue-500" required>
                    <option value="" disabled>Pilih ID Klien</option>
                    {% for client in clients %}
                        <option value="{{ client.no_identitas }}" {% if client.no_identitas == visit.no_identitas_klien %}selected{% endif %}>
                            {{ client.no_identitas }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex flex-col">
                <label for="nama-hewan" class="mb-2 text-gray-700 font-semibold">Nama Hewan</label>
                <select id="nama-hewan" name="nama_hewan" class="border rounded-lg p-3 focus:ring-2 focus:ring-blue-500" required>
                    <option value="" disabled>Pilih Nama Hewan</option>
                    {% for animal in animals %}
                        <option value="{{ animal.nama }}" {% if animal.nama == visit.nama_hewan %}selected{% endif %}>
                            {{ animal.nama }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="flex flex-col">
                <label for="metode-kunjungan" class="mb-2 text-gray-700 font-semibold">Metode Kunjungan</label>
                <select id="metode-kunjungan" name="metode_kunjungan" class="border rounded-lg p-3 focus:ring-2 focus:ring-blue-500" required>
                    <option value="" disabled>Pilih Metode Kunjungan</option>
                    <option value="Janji Temu" {% if visit.tipe_kunjungan == 'Janji Temu' %}selected{% endif %}>Janji Temu</option>
                    <option value="Walk-In" {% if visit.tipe_kunjungan == 'Walk-In' %}selected{% endif %}>Walk-In</option>
                    <option value="Darurat" {% if visit.tipe_kunjungan == 'Darurat' %}selected{% endif %}>Darurat</option>
                </select>
            </div>

            <div class="flex flex-col">
                <label for="waktu-mulai" class="mb-2 text-gray-700 font-semibold">Waktu Mulai Penanganan</label>
                <input type="datetime-local" id="waktu-mulai" name="waktu_mulai" 
                       value="{{ visit.timestamp_awal|date:'Y-m-d\TH:i' }}" 
                       class="border rounded-lg p-3 focus:ring-2 focus:ring-blue-500" required>
            </div>

            <div class="flex flex-col">
                <label for="waktu-selesai" class="mb-2 text-gray-700 font-semibold">Waktu Selesai Penanganan</label>
                <input type="datetime-local" id="waktu-selesai" name="waktu_selesai" 
                       value="{{ visit.timestamp_akhir|date:'Y-m-d\TH:i' }}" 
                       class="border rounded-lg p-3 focus:ring-2 focus:ring-blue-500" required>
            </div>
        </div>

        <div class="flex gap-4 mt-6">
            <button type="button" onclick="history.back()" class="bg-red-700 hover:bg-red-800 text-white font-semibold py-2 px-6 rounded-lg">
                Cancel
            </button>
            <button type="submit" class="bg-blue-900 hover:bg-blue-950 text-white font-semibold py-2 px-6 rounded-lg">
                Update
            </button>
        </div>
    </form>
</div>

<script>
    // Update animals when client is changed
    document.getElementById('id-klien').addEventListener('change', function() {
        const clientId = this.value;
        const animalSelect = document.getElementById('nama-hewan');
        
        if (clientId) {
            fetch(`/get-animals/?client_id=${clientId}`)
                .then(response => response.json())
                .then(data => {
                    animalSelect.innerHTML = '<option value="" disabled>Pilih Nama Hewan</option>';
                    data.animals.forEach(animal => {
                        const option = document.createElement('option');
                        option.value = animal.nama;
                        option.textContent = animal.nama;
                        animalSelect.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('Error fetching animals:', error);
                    animalSelect.innerHTML = '<option value="" disabled>Error loading animals</option>';
                });
        }
    });
</script>
{% endblock %}
