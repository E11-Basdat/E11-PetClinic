<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Kunjungan - Pet Clinic</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -15px;
        }
        .form-col {
            flex: 1;
            padding: 0 15px;
            min-width: 250px;
        }
        .button-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 30px;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            border: none;
        }
        .btn-cancel {
            background-color: #7f8c8d;
            color: white;
        }
        .btn-create {
            background-color: #192a56;
            color: white;
        }
        @media (max-width: 768px) {
            .form-col {
                flex: 100%;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Kunjungan</h1>
        
        <form action="/create/" method="post">
            <div class="form-row">
                <div class="form-col">
                    <div class="form-group">
                        <label for="id-klien">ID Klien</label>
                        <select id="id-klien" name="id_klien" required>
                            <option value="" disabled selected>Pilih ID Klien</option>
                            <option value="FDO123">FDO123</option>
                            <option value="KII123">KII123</option>
                            <option value="PKE123">PKE123</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-col">
                    <div class="form-group">
                        <label for="nama-hewan">Nama Hewan</label>
                        <select id="nama-hewan" name="nama_hewan" required>
                            <option value="" disabled selected>Pilih Nama Hewan</option>
                            <option value="Snowy">Snowy</option>
                            <option value="Blacky">Blacky</option>
                            <option value="Hamseung">Hamseung</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-col">
                    <div class="form-group">
                        <label for="metode-kunjungan">Metode Kunjungan</label>
                        <select id="metode-kunjungan" name="metode_kunjungan" required>
                            <option value="" disabled selected>Pilih metode kunjungan</option>
                            <option value="Janji Temu">Janji Temu</option>
                            <option value="Walk-In">Walk-In</option>
                            <option value="Darurat">Darurat</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-col">
                    <div class="form-group">
                        <label for="waktu-mulai">Waktu Mulai Penanganan</label>
                        <input type="datetime-local" id="waktu-mulai" name="waktu_mulai" required 
                               pattern="\d{2}-\d{2}-\d{4} \d{2}:\d{2}" 
                               placeholder="DD-MM-YYYY HH:MM">
                    </div>
                </div>
                
                <div class="form-col">
                    <div class="form-group">
                        <label for="waktu-selesai">Waktu Selesai Penanganan</label>
                        <input type="datetime-local" id="waktu-selesai" name="waktu_selesai" required 
                               pattern="\d{2}-\d{2}-\d{4} \d{2}:\d{2}" 
                               placeholder="DD-MM-YYYY HH:MM">
                    </div>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" class="btn btn-cancel">Cancel</button>
                <a href="{% url 'visits:visit_list_fd' %}" class="btn btn-create">Create</a>
            </div>
        </form>
    </div>

    <script>
        // Format tanggal untuk input datetime-local
        document.getElementById('waktu-mulai').addEventListener('focus', function() {
            this.type = 'datetime-local';
        });
        
        document.getElementById('waktu-selesai').addEventListener('focus', function() {
            this.type = 'datetime-local';
        });
        
        // Handle cancel button
        document.querySelector('.btn-cancel').addEventListener('click', function() {
            if(confirm('Apakah Anda yakin ingin membatalkan pembuatan kunjungan?')) {
                window.location.href = '/list/'; // Ganti dengan URL list kunjungan
            }
        });
        
        // Update nama hewan berdasarkan ID Klien yang dipilih
        document.getElementById('id-klien').addEventListener('change', function() {
            const namaHewanSelect = document.getElementById('nama-hewan');
            namaHewanSelect.innerHTML = '<option value="" disabled selected>Pilih Nama Hewan</option>';
            
            // Simulasi data hewan berdasarkan klien
            const hewanByKlien = {
                'FDO123': ['Snowy'],
                'KII123': ['Blacky'],
                'PKE123': ['Hamseung']
            };
            
            const selectedKlien = this.value;
            if (selectedKlien && hewanByKlien[selectedKlien]) {
                hewanByKlien[selectedKlien].forEach(hewan => {
                    const option = document.createElement('option');
                    option.value = hewan;
                    option.textContent = hewan;
                    namaHewanSelect.appendChild(option);
                });
            }
        });
    </script>
</body>
</html>
