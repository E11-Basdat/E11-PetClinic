<h1>Buat Rekam Medis</h1>

<form method="POST">
    {% csrf_token %}
    
    <label for="suhu">Suhu Tubuh (°C):</label>
    <input type="number" id="suhu" name="suhu" step="0.1" required>
    <br>

    <label for="berat_badan">Berat Badan (kg):</label>
    <input type="number" id="berat_badan" name="berat_badan" step="0.1" required>
    <br>

    <label for="kode_vaksin">Kode Vaksin (Opsional):</label>
    <select id="kode_vaksin" name="kode_vaksin">
        <option value="" disabled selected>Pilih Kode Vaksin</option>
        {% for vaksin in daftar_vaksin %}
        <option value="{{ vaksin.0 }}">{{ vaksin.0 }} - {{ vaksin.1 }}</option>
        {% endfor %}
    </select>
    <br>

    <label for="catatan">Catatan:</label>
    <textarea id="catatan" name="catatan" rows="4" required></textarea>
    <br>

    <button type="submit" class="btn btn-primary">Create</button>
    <a href="{% url 'visits:list_visits' %}" class="btn btn-secondary">Cancel</a>
</form>

<style>
    .btn {
        padding: 10px 20px;
        margin: 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .btn-primary {
        background-color: #007bff;
        color: white;
    }

    .btn-secondary {
        background-color: #6c757d;
        color: white;
        text-decoration: none;
    }

    .btn:hover {
        opacity: 0.9;
    }
</style>
