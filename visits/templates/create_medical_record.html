<h1>Daftar Kunjungan</h1>
<table>
    <tr>
        <th>ID Kunjungan</th>
        <th>Nama Hewan</th>
        <th>Metode Kunjungan</th>
        <th>Waktu Mulai</th>
        <th>Waktu Akhir</th>
        <th>Rekam Medis</th>
    </tr>
    {% for visit in visits %}
    <tr>
        <td>{{ visit.0 }}</td>
        <td>{{ visit.2 }}</td>
        <td>{{ visit.3 }}</td>
        <td>{{ visit.4 }}</td>
        <td>{{ visit.5 }}</td>
        <td>
            <a href="#" class="check-medical-record" data-id="{{ visit.0 }}">Lihat Rekam Medis</a>
        </td>
    </tr>
    {% endfor %}
</table>

<!-- Modal untuk menampilkan rekam medis -->
<div id="medical-record-modal" class="modal hidden">
    <div class="modal-content">
        <h2>Rekam Medis</h2>
        <p id="medical-record-message"></p>
        <button id="create-medical-record" class="btn btn-primary">Create</button>
        <button id="close-modal" class="btn btn-secondary">Close</button>
    </div>
</div>

<style>
    /* Modal styling */
    .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    .modal.hidden {
        display: none;
    }

    .modal-content {
        background: white;
        padding: 20px;
        border-radius: 8px;
        width: 400px;
        text-align: center;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .btn {
        padding: 10px 20px;
        margin: 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .btn-primary {
        background-color: #007bff;
        color: white;
    }

    .btn-secondary {
        background-color: #6c757d;
        color: white;
    }

    .btn:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
    }
</style>

<script>
    document.querySelectorAll('.check-medical-record').forEach(link => {
        link.addEventListener('click', function (e) {
            e.preventDefault();
            const idKunjungan = this.getAttribute('data-id');

            // AJAX request untuk memeriksa rekam medis
            fetch(`/visits/check-medical-record/${idKunjungan}/`)
                .then(response => response.json())
                .then(data => {
                    const modal = document.getElementById('medical-record-modal');
                    const message = document.getElementById('medical-record-message');
                    const createButton = document.getElementById('create-medical-record');

                    if (data.exists) {
                        message.textContent = `Rekam Medis ditemukan: ${data.data.catatan}`;
                    } else {
                        message.textContent = 'Rekam Medis tidak ditemukan.';
                    }

                    // Atur tombol Create
                    createButton.onclick = function () {
                        window.location.href = `/visits/medical-records/create/${idKunjungan}/`;
                    };

                    // Validasi user type
                    {% if request.session.user_type != 'dokter' %}
                    createButton.disabled = true;
                    {% else %}
                    createButton.disabled = false;
                    {% endif %}

                    modal.classList.remove('hidden');
                });
        });
    });

    document.getElementById('close-modal').addEventListener('click', function () {
        document.getElementById('medical-record-modal').classList.add('hidden');
    });
</script>
